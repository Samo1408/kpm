name: Build Universal Samsung Spoof - KPatch Next ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip make curl xz-utils

      - name: Install AArch64 bare-metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN_VERSION=14.3.rel1
          TOOLCHAIN_ARCHIVE=arm-gnu-toolchain-${TOOLCHAIN_VERSION}-x86_64-aarch64-none-elf.tar.xz
          TOOLCHAIN_URL=https://developer.arm.com/-/media/Files/downloads/gnu/${TOOLCHAIN_VERSION}/binrel/${TOOLCHAIN_ARCHIVE}
          curl -L --fail --retry 5 --retry-all-errors "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE"
          tar -xJf "$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE" -C "$RUNNER_TEMP"
          TOOLCHAIN_DIR="$RUNNER_TEMP/${TOOLCHAIN_ARCHIVE%.tar.xz}"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          "$TOOLCHAIN_DIR/bin/aarch64-none-elf-gcc" --version

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/ndk-build"

      - name: Build Zygisk ARM64
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ANDROID_NDK/ndk-build"
          echo "Using NDK: $ANDROID_NDK"
          "$ANDROID_NDK/ndk-build" --version
          cd zygisk/jni
          "$ANDROID_NDK/ndk-build"             NDK_PROJECT_PATH="$PWD"             APP_BUILD_SCRIPT="$PWD/Android.mk"             NDK_APPLICATION_MK="$PWD/Application.mk"
          test -f libs/arm64-v8a/libuniversal_spoof.so
          echo "=== Zygisk exported symbols ==="
          readelf -Ws --dyn-syms libs/arm64-v8a/libuniversal_spoof.so | grep -E "[[:space:]]zygisk_module_entry$|[[:space:]]zygisk_companion_entry$"
          readelf -Ws --dyn-syms libs/arm64-v8a/libuniversal_spoof.so | grep -qE "[[:space:]]GLOBAL[[:space:]]+DEFAULT[[:space:]].*zygisk_module_entry$"
          ! readelf -Ws --dyn-syms libs/arm64-v8a/libuniversal_spoof.so | grep -Eq '[[:space:]]GLOBAL[[:space:]]+DEFAULT[[:space:]].*_Z[0-9]+zygisk_module_entry'

      
      - name: Verify bundled KPatch Next source
        shell: bash
        run: |
          set -euo pipefail
          KP_DIR="$PWD/third_party/KPatch-Next-EXP"
          test -f "$KP_DIR/kernel/include/kpmodule.h"
          test -f "$KP_DIR/kernel/include/compiler.h"
          test -f "$KP_DIR/kernel/include/hook.h"
          echo "Using bundled KPatch Next source:"
          cat "$KP_DIR/version"

      - name: Build KPM
        shell: bash
        run: |
          set -euo pipefail
          export TARGET_COMPILE=aarch64-none-elf-
          command -v aarch64-none-elf-gcc
          make -C kpm clean
          make -C kpm KP_DIR="$PWD/third_party/KPatch-Next-EXP" TARGET_COMPILE="$TARGET_COMPILE"
          test -f kpm/universal-samsung-spoof.kpm
          file kpm/universal-samsung-spoof.kpm

      - name: Package Zygisk module
        run: |
          rm -rf dist universal-samsung-spoof
          mkdir -p dist/universal-samsung-spoof/zygisk
          cp packaging/module.prop dist/universal-samsung-spoof/module.prop
          cp packaging/profile.prop dist/universal-samsung-spoof/profile.prop
          cp packaging/post-fs-data.sh dist/universal-samsung-spoof/post-fs-data.sh
          cp packaging/service.sh dist/universal-samsung-spoof/service.sh
          cp zygisk/jni/libs/arm64-v8a/libuniversal_spoof.so dist/universal-samsung-spoof/zygisk/arm64-v8a.so
          chmod 0755 dist/universal-samsung-spoof/*.sh
          cd dist
          zip -r ../universal-samsung-spoof-zygisk-alpha2.zip universal-samsung-spoof

      - name: Package complete artifact
        run: |
          mkdir -p dist/complete
          cp universal-samsung-spoof-zygisk-alpha2.zip dist/complete/
          cp kpm/universal-samsung-spoof.kpm dist/complete/
          cp docs/HOOK_MATRIX.md dist/complete/
          #cp universal-spoof-ui-debug.apk dist/complete/UniversalSpoofUI-debug.apk
          cd dist/complete
          zip -r ../../universal-samsung-spoof-complete-alpha2.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-samsung-spoof-alpha2
          path: |
            universal-samsung-spoof-zygisk-alpha2.zip
            universal-samsung-spoof-complete-alpha2.zip
            dist/complete/universal-samsung-spoof.kpm
            #universal-spoof-ui-debug.apk
